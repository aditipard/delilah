[develop]
script_dir=$base/lib/lekiwi_ros
[install]
install_scripts=$base/lib/lekiwi_ros
# Start the nodes with whichever "python" is active in the selected environment.
# On this system, python3 resolves to the system interpreter while lerobot is
# installed in the active Conda environment.
[build_scripts]
executable=/usr/bin/env python
